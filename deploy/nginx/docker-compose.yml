# nginx with TLS (Let's Encrypt) in front of the nt-sync HTTP API.
#
# The API keeps running as before (systemd, listening on 127.0.0.1:8080). This stack only adds the
# public HTTPS entry point. First time: ./init-letsencrypt.sh. Afterwards:
#
#   docker compose up -d          start (also after a reboot: restart policy)
#   docker compose logs -f nginx  access log; Ctrl+C only closes the log
#   docker compose down           stop
#
# Needs .env next to this file (copy .env.example).
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    # Host network: nginx binds the host's ports 80/443 and reaches the API on the host's loopback.
    # With a bridge network, 127.0.0.1 would be the container itself. Ports 80 and 443 must be free.
    network_mode: host
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      # rendered with API_DOMAIN into /etc/nginx/conf.d/default.conf when the container starts
      - ./templates:/etc/nginx/templates:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    # Reload every 6 hours so a renewed certificate is picked up without downtime.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v3.3.0
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Renewal is attempted twice a day; certbot only renews certificates that expire in under 30 days.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
