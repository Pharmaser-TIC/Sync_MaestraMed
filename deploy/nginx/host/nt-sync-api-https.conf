# Step 2 of 2: install it only AFTER the certificate exists (nginx refuses to load it before).
#
#   sudo sed 's/YOUR_DOMAIN/api.yourdomain.com/g' nt-sync-api-https.conf | sudo tee /etc/nginx/conf.d/nt-sync-api-https.conf
#
# Works with nginx 1.18 and later ("listen 443 ssl http2" is deprecated from 1.25.1 and still accepted).
# conf.d/*.conf is included inside the http block, which is where limit_*_zone must live. The zone
# names start with nt_ so they cannot clash with zones you may already have.

# Per IP slows down key guessing and scans; per key keeps one project from starving the others.
limit_req_zone $binary_remote_addr zone=nt_ip:10m rate=20r/s;
limit_req_zone $http_x_api_key zone=nt_key:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=nt_conn:10m;

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API only answers GET: no request needs a body.
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Only the API is exposed; everything else, /healthz included, is a plain 404.
    location /v1/ {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=nt_ip burst=40 nodelay;
        limit_req zone=nt_key burst=60 nodelay;
        limit_req_status 429;
        limit_conn nt_conn 20;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # set, not appended: a client-supplied X-Forwarded-For must not be trusted
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
