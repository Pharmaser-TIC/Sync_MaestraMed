# Step 1 of 2 for an nginx that is already installed on the host (not the Docker one).
# Port 80 only: it answers the Let's Encrypt challenge and redirects everything else to HTTPS.
#
#   sudo sed 's/YOUR_DOMAIN/api.yourdomain.com/g' nt-sync-api-http.conf | sudo tee /etc/nginx/conf.d/nt-sync-api-http.conf
server {
    listen 80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
